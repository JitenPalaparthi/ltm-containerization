apiVersion: apps/v1
kind: Deployment
metadata:
  name: picture-upload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: picture-upload
  template:
    metadata:
      labels:
        app: picture-upload
    spec:
      containers:
        - name: picture-upload
          image: picture-upload:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: SECRET_KEY
              value: kind-demo-change-me
          volumeMounts:
            - name: pictures
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: pictures
          persistentVolumeClaim:
            claimName: pictures-pvc

apiVersion: apps/v1
kind: Deployment

metadata:
  name: image-uploader

spec:
  replicas: 1

  selector:
    matchLabels:
      app: image-uploader

  template:
    metadata:
      labels:
        app: image-uploader

    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 10001:10001 /data/images
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: image-storage
              mountPath: /data/images

      containers:
        - name: image-uploader
          image: jpalaparthi/go-image-pvc-demo:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          securityContext:
            runAsUser: 10001
            runAsGroup: 10001

          volumeMounts:
            - name: image-storage
              mountPath: /data/images

      volumes:
        - name: image-storage
          persistentVolumeClaim:
            claimName: images-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: image-uploader
spec:
  selector:
    app: image-uploader
  ports:
    - port: 80
      targetPort: 8080

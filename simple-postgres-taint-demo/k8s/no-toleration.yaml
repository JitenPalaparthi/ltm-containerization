apiVersion: v1
kind: Pod
metadata:
  name: no-toleration
  namespace: taint-demo
spec:
  # Same node selector, but intentionally no toleration.
  nodeSelector:
    workload: database
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi

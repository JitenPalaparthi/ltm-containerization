apiVersion: v1
kind: Pod
metadata:
  name: selector-pending
  namespace: pending-lab
  labels:
    app: pending-lab-demo
spec:
  nodeSelector:
    lab.example.com/role: node-that-does-not-exist
  containers:
    - name: app
      image: pending-pods-lab:local
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 25m
          memory: 32Mi

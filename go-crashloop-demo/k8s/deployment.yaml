apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-crash-demo
  namespace: crash-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-crash-demo
  template:
    metadata:
      labels:
        app: go-crash-demo
    spec:
      containers:
        - name: go-crash-demo
          image: jpalaparthi/crash-demo:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CRASH_AFTER_SECONDS
              value: "45"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

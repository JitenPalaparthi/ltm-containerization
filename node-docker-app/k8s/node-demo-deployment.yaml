apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-demo
  labels:
    app: node-demo
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: node-demo
  template:
    metadata:
      labels:
        app: node-demo
    spec:
      containers:
        - name: node-demo
          image: jpalaparthi/node-demo:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

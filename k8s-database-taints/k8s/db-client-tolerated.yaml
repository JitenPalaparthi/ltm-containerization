apiVersion: v1
kind: Pod
metadata:
  name: db-client
  namespace: database-lab
spec:
  nodeSelector:
    lab.example.com/dedicated: database
  tolerations:
    - key: lab.example.com/dedicated
      operator: Equal
      value: database
      effect: NoSchedule
  containers:
    - name: psql
      image: postgres:16-alpine
      imagePullPolicy: IfNotPresent
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_PASSWORD
      command:
        - sh
        - -c
        - >-
          until pg_isready -h postgres -U labuser -d labdb; do sleep 2; done;
          psql -h postgres -U labuser -d labdb -c 'SELECT current_database(), current_user;';
          sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

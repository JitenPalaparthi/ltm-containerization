apiVersion: v1
kind: Pod
metadata:
  name: no-db-toleration
  namespace: database-lab
spec:
  # Force the example to target the dedicated node, then observe the taint rejection.
  nodeSelector:
    lab.example.com/dedicated: database
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi

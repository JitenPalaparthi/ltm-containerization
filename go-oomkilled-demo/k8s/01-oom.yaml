apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-oom-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-oom-demo
  template:
    metadata:
      labels:
        app: go-oom-demo
    spec:
      containers:
        - name: app
          image: go-oom-demo:v1
          imagePullPolicy: Never
          env:
            - name: TARGET_MIB
              value: "150"
            - name: STEP_MIB
              value: "10"
            - name: GOGC
              value: "off"
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 80Mi
              cpu: 500m

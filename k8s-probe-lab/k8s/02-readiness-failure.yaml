# Scenario B: app is healthy but readiness always returns 503.
# Pod remains Running but 0/1 Ready; NO CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-failure
  namespace: probe-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: readiness-failure}
  template:
    metadata:
      labels: {app: readiness-failure}
    spec:
      containers:
        - name: app
          image: jpalaparthi/go-probe-lab:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: STARTUP_SECONDS, value: "2"}
            - {name: READY_AFTER_SECONDS, value: "999999"}
          startupProbe:
            httpGet: {path: /startup, port: 8080}
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-failure
  namespace: probe-lab
spec:
  selector: {app: readiness-failure}
  ports: [{port: 80, targetPort: 8080}]
